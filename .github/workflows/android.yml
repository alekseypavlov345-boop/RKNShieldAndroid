name: ShieldBreaker Android APK

on:
  push:
    branches: [ "main" ]
    paths:
      - ".github/workflows/android.yml"
      - "shieldbreaker_patch.py"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Native build tools
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;35.0.0" "ndk;27.0.12077973" "cmake;3.22.1"

      - name: Fetch network engine source
        run: |
          rm -rf upstream
          mkdir upstream
          cd upstream
          git init
          git remote add origin https://github.com/romanvht/ByeByeDPI.git
          git fetch --depth 1 origin ffda4fa93d94472217c75e51b45fdd18f966c0af
          git checkout --detach FETCH_HEAD
          git submodule update --init --recursive --depth 1

      - name: Apply ShieldBreaker app layer
        run: python3 shieldbreaker_patch.py

      - name: Add ShieldBreaker UI icons
        run: |
          python3 - <<'PY'
          from pathlib import Path
          d = Path('upstream/app/src/main/res/drawable')
          layout = Path('upstream/app/src/main/res/layout/activity_main.xml')
          d.joinpath('shieldbreaker_settings.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="24dp" android:height="24dp" android:viewportWidth="24" android:viewportHeight="24">
            <path android:fillColor="#A9BDD2" android:pathData="M12,8A4,4 0,1 0,12,16A4,4 0,1 0,12,8M19,13.5L21,15L19,18.5L16.5,17.5C16,17.9 15.4,18.2 14.8,18.5L14.4,21H9.6L9.2,18.5C8.6,18.2 8,17.9 7.5,17.5L5,18.5L3,15L5,13.5C4.9,13 4.9,12.5 5,12L3,10.5L5,7L7.5,8C8,7.6 8.6,7.3 9.2,7L9.6,4.5H14.4L14.8,7C15.4,7.3 16,7.6 16.5,8L19,7L21,10.5L19,12C19.1,12.5 19.1,13 19,13.5Z"/>
          </vector>''', encoding='utf-8')
          d.joinpath('shieldbreaker_power.xml').write_text('''<?xml version="1.0" encoding="utf-8"?>
          <vector xmlns:android="http://schemas.android.com/apk/res/android" android:width="64dp" android:height="64dp" android:viewportWidth="64" android:viewportHeight="64">
            <path android:fillColor="@android:color/transparent" android:strokeColor="#F5FAFF" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M32,7 L32,30"/>
            <path android:fillColor="@android:color/transparent" android:strokeColor="#F5FAFF" android:strokeWidth="5" android:strokeLineCap="round" android:pathData="M19,15 C11,20 8,29 10,38 C12,49 21,56 32,56 C43,56 52,49 54,38 C56,29 53,20 45,15"/>
          </vector>''', encoding='utf-8')
          text = layout.read_text(encoding='utf-8')
          text = text.replace('@drawable/baseline_settings_24', '@drawable/shieldbreaker_settings')
          text = text.replace('@drawable/ic_power', '@drawable/shieldbreaker_power')
          layout.write_text(text, encoding='utf-8')
          PY

      - name: Fix hidden legacy strategy function
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('upstream/app/src/main/java/io/github/romanvht/byedpi/activities/MainActivity.kt')
          text = p.read_text(encoding='utf-8')
          pattern = r'''    private fun updateStrategyButton\(\) \{.*?\n    \}\n\n    private fun showStrategyPicker\(\)'''
          replacement = '''    private fun updateStrategyButton() {
              binding.strategyButton.visibility = View.GONE
              binding.cmdButtonsRow.visibility = View.GONE
          }

          private fun showStrategyPicker()'''
          fixed, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'updateStrategyButton patch count={count}')
          p.write_text(fixed, encoding='utf-8')
          PY

      - name: Replace status UI with ShieldBreaker controls
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('upstream/app/src/main/java/io/github/romanvht/byedpi/activities/MainActivity.kt')
          text = p.read_text(encoding='utf-8')
          pattern = r'''    private fun updateStatus\(\) \{.*?\n    \}\n\n    private fun updateStrategyButton\(\)'''
          replacement = '''    private fun updateStatus() {
              val (status, _) = appStatus
              Log.i(TAG, "Updating ShieldBreaker status: $status")

              val statusText = findViewById<TextView>(R.id.status_text)
              val powerCard = findViewById<com.google.android.material.card.MaterialCardView>(R.id.status_button_card)
              val powerIcon = findViewById<android.widget.ImageView>(R.id.status_button_icon)

              when (status) {
                  AppStatus.Halted -> {
                      powerCard.setCardBackgroundColor(android.graphics.Color.parseColor("#0B1B2E"))
                      powerCard.strokeColor = android.graphics.Color.parseColor("#1E90FF")
                      powerIcon.clearColorFilter()
                      statusText.setText(R.string.vpn_disconnected)
                  }
                  AppStatus.Running -> {
                      powerCard.setCardBackgroundColor(android.graphics.Color.parseColor("#0B1B2E"))
                      powerCard.strokeColor = android.graphics.Color.parseColor("#22A3FF")
                      powerIcon.setColorFilter(android.graphics.Color.WHITE)
                      statusText.setText(R.string.vpn_connected)
                  }
              }
          }

          private fun updateStrategyButton()'''
          fixed, count = re.subn(pattern, replacement, text, count=1, flags=re.S)
          if count != 1:
              raise SystemExit(f'updateStatus patch count={count}')
          p.write_text(fixed, encoding='utf-8')
          PY

      - name: Verify app identity
        run: |
          grep -q 'com.shieldbreaker.android' upstream/app/build.gradle.kts
          grep -q 'versionName = "1.0"' upstream/app/build.gradle.kts
          grep -q 'switch_youtube' upstream/app/src/main/res/layout/activity_main.xml
          grep -q 'shieldbreaker_logo' upstream/app/src/main/AndroidManifest.xml
          grep -q 'shieldbreaker_power' upstream/app/src/main/res/layout/activity_main.xml
          grep -q 'Updating ShieldBreaker status' upstream/app/src/main/java/io/github/romanvht/byedpi/activities/MainActivity.kt

      - name: Build APK
        working-directory: upstream
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace

      - name: Prepare APK
        run: |
          APK="$(find upstream/app/build/outputs/apk -type f -name '*universal*debug*.apk' -print -quit)"
          if [ -z "$APK" ]; then APK="$(find upstream/app/build/outputs/apk -type f -name '*debug*.apk' -print -quit)"; fi
          test -n "$APK"
          cp "$APK" ShieldBreaker-v1.apk
          sha256sum ShieldBreaker-v1.apk

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ShieldBreaker-v1-apk
          path: ShieldBreaker-v1.apk

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="shieldbreaker-v1.0"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" ShieldBreaker-v1.apk --clobber
          else
            gh release create "$TAG" ShieldBreaker-v1.apk --title "ShieldBreaker v1.0" --notes "ShieldBreaker v1.0 Android APK. Original ShieldBreaker interface and branding. Open-source component licenses are preserved in source." --target "$GITHUB_SHA"
          fi
