name: Android APK

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platforms;android-36" "build-tools;36.0.0"

      - name: Set up Gradle 9.5.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.5.0"

      - name: Build debug APK
        run: gradle :app:assembleDebug --stacktrace

      - name: Prepare release APK
        run: cp app/build/outputs/apk/debug/app-debug.apk RKNShield-v2.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: RKNShield-v2-apk
          path: RKNShield-v2.apk

      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view v2.0 >/dev/null 2>&1; then
            gh release upload v2.0 RKNShield-v2.apk --clobber
          else
            gh release create v2.0 RKNShield-v2.apk \
              --title "RKNShield v2.0" \
              --notes "Готовый APK для установки на Android 7.0 и новее." \
              --target "$GITHUB_SHA"
          fi
